timeout 0
default 1
title ghostos installer

entry GhostOS installer
kernel /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% init=/usr/local/bin/ginit

entry Firmware setup
firmware

entry Reboot
reboot

entry Shutdown
shutdown
